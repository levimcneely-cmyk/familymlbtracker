<main>
  <div id="banner" class="banner info" role="status" hidden></div>

  <section class="panel" id="showdown-wrap" aria-label="Family showdown" hidden>

  </section>

  <section class="panel" id="leaderboard-wrap" aria-label="Family leaderboard" hidden>

  <div class="cards" id="cards"></div>

  <div class="legend">

  </div>

  <div class="bottom-bar">
    <span id="last-updated">Loading…</span>
    <div class="bar-actions">
      <button id="tz-btn" type="button" aria-label="Switch between Eastern Time and your local time">Times: ET</button>
      <button id="refresh-btn" type="button">Refresh Stats</button>
    </div>
  </div>

  <section class="panel" id="trend-wrap" aria-label="Season trend" hidden>
    <details class="panel-inner" id="trend"></details>
  </section>

  <section class="panel" id="history-wrap" aria-label="Past seasons" hidden>
    <details class="panel-inner" id="history"></details>
  </section>

  <section class="panel" id="debug-wrap" aria-label="Debug" hidden>
    <div class="panel-inner dbg">
      <div class="dbg-head">
        <strong>Debug</strong>
        <button class="small" id="dbg-copy" type="button">Copy report</button>
      </div>

      <table id="dbg-log"></table>
      <select id="dbg-select" aria-label="Raw API response"></select>
      <pre id="dbg-raw">No responses yet.</pre>
    </div>
  </section>
</main>
