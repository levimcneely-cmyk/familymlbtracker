<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Family MLB tracker: four teams, live stats from MLB.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MLB Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Family MLB Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#cards">Skip to the teams</a>

<header>
  <h1>Family <span>MLB</span> Tracker</h1>
  <div class="season-tag" id="season-tag">Loading…</div>
</header>

<main>
  <div id="banner" class="banner info" role="status" hidden></div>

  <section class="panel" id="showdown-wrap" aria-label="Family showdown" hidden>
    <div class="showdown" id="showdown"></div>
  </section>

  <section class="panel" id="leaderboard-wrap" aria-label="Family leaderboard" hidden>
    <div class="panel-inner" id="leaderboard"></div>
  </section>

  <div class="cards" id="cards"></div>

  <div class="legend">
    <span class="legend-star" aria-hidden="true">★</span>
    <span>leads the family (lowest wins for RA) · cards sorted by ★, ties by MLB rank</span>
  </div>

  <div class="bottom-bar">
    <span id="last-updated">Loading…</span>
    <div class="bar-actions">
      <button id="tz-btn" type="button" aria-label="Switch between Eastern Time and your local time">Times: ET</button>
      <button id="refresh-btn" type="button">Refresh Stats</button>
    </div>
  </div>

  <section class="panel" id="trend-wrap" aria-label="Season trend" hidden>
    <details class="panel-inner" id="trend"></details>
  </section>

  <section class="panel" id="history-wrap" aria-label="Past seasons" hidden>
    <details class="panel-inner" id="history"></details>
  </section>

  <section class="panel" id="debug-wrap" aria-label="Debug" hidden>
    <div class="panel-inner dbg">
      <div class="dbg-head">
        <strong>Debug</strong>
        <button class="small" id="dbg-copy" type="button">Copy report</button>
      </div>
      <div class="mono" id="dbg-state"></div>
      <table id="dbg-log"></table>
      <select id="dbg-select" aria-label="Raw API response"></select>
      <pre id="dbg-raw">No responses yet.</pre>
    </div>
  </section>
</main>

<footer class="footer">
  <span>Data: MLB Stats API</span>
  <button id="debug-toggle" type="button">debug</button>
</footer>

<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<noscript><div class="banner error">This tracker needs JavaScript turned on.</div></noscript>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
